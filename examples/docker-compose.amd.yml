# Distillarr with an AMD GPU (VA-API through Mesa).
# AMD's AMF encoders don't exist in Linux ffmpeg builds; VA-API is the
# hardware path. Upscaling uses Mesa's Vulkan driver (RADV).
services:
  distillarr:
    image: ghcr.io/creaturesurvive/distillarr:latest
    container_name: distillarr
    restart: unless-stopped
    ports:
      - "8093:8080"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      LIBVA_DRIVER_NAME: radeonsi
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./config:/config
      - /path/to/media:/data
